<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CardWay | 我的卡包設定</title>
    <!-- 引入 LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- 引入 Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- 引入 FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 日系清新藍 Glassmorphism 主題 */
            --primary: #00bcd4;
            --primary-dark: #0097a7;
            --primary-light: #b2ebf2;
            --bg-gradient-start: #e0f7fa;
            --bg-gradient-end: #80deea;
            --surface: rgba(255, 255, 255, 0.25);
            --surface-solid: rgba(255, 255, 255, 0.85);
            --text-main: #1a365d;
            --text-sub: #4a6fa5;
            --border: rgba(255, 255, 255, 0.4);
            --shadow-glass: 0 8px 32px rgba(0, 188, 212, 0.15);
            --shadow-glow: 0 0 20px rgba(0, 188, 212, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
            min-height: 100vh;
            position: relative;
        }

        /* 裝飾性浮動圓球 */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #4dd0e1, #00acc1);
            top: -100px;
            right: -100px;
        }

        body::after {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #80deea, #26c6da);
            bottom: 20%;
            left: -80px;
            animation-delay: -4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* Layout */
        .app-container {
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
            max-width: 500px;
            /* 手機版型優化 */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism Card Style */
        .ui-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-glass);
            border: 1px solid var(--border);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .ui-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .ui-card:active {
            transform: scale(0.98);
        }

        /* Views Transition */
        .view {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }

        .view.active {
            display: block;
            opacity: 1;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Typography */
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        /* Home Stats - Modern Grid */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-item {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px 16px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--border);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
        }

        .stat-val {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 2px 8px rgba(0, 188, 212, 0.3);
        }

        .stat-lbl {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 500;
        }

        /* Visual Credit Card Style */
        .visual-card {
            background: linear-gradient(135deg, #475569 0%, #1e293b 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 12px;
            position: relative;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* Dynamic gradients for cards */
        .visual-card[data-bank="013 國泰世華"] {
            background: linear-gradient(135deg, #01a33d 0%, #008530 100%);
        }

        .visual-card[data-bank="822 中國信託"] {
            background: linear-gradient(135deg, #009E96 0%, #006862 100%);
        }

        .visual-card[data-bank="812 台新銀行"] {
            background: linear-gradient(135deg, #E60012 0%, #99000c 100%);
        }

        .visual-card[data-bank="012 台北富邦"] {
            background: linear-gradient(135deg, #0076CE 0%, #004b85 100%);
        }

        .visual-card[data-bank="808 玉山銀行"] {
            background: linear-gradient(135deg, #00A650 0%, #007036 100%);
        }

        .vc-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .vc-chip {
            width: 36px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            position: relative;
        }

        .vc-chip::after {
            content: '';
            position: absolute;
            border: 1px solid rgba(0, 0, 0, 0.1);
            width: 100%;
            height: 50%;
            top: 25%;
            border-left: 0;
            border-right: 0;
        }

        .vc-name {
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .vc-bank {
            font-size: 12px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* Search Bar - Glassmorphism */
        .search-container {
            margin-bottom: 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--surface-solid);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-glass);
            border-radius: 16px;
            padding: 16px 16px 16px 48px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }

        .search-input::placeholder {
            color: var(--text-sub);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 16px;
        }

        /* Bank Pills - Glassmorphism */
        .bank-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            max-height: 200px;
            overflow-y: auto;
            padding: 4px;
        }

        .bank-pill {
            padding: 10px 18px;
            border-radius: 50px;
            background: var(--surface-solid);
            backdrop-filter: blur(8px);
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--border);
        }

        .bank-pill:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .bank-pill.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: var(--shadow-glow);
            border-color: transparent;
        }

        /* Selection List */
        .selection-list {
            display: grid;
            gap: 12px;
        }

        .selection-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-radius: 16px;
            background: var(--surface);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-icon {
            background: #F3F4F6;
            color: var(--primary);
        }

        .add-icon:hover {
            background: var(--primary);
            color: #fff;
        }

        .remove-icon {
            background: #FEE2E2;
            color: #EF4444;
        }

        /* Payment Mapping */
        .pay-section {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .pay-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .pay-icon {
            width: 36px;
            height: 36px;
            background: #F3F4F6;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 16px;
        }

        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .mini-chip {
            padding: 6px 14px;
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: 50px;
            font-size: 12px;
            color: var(--text-sub);
            cursor: pointer;
            transition: 0.2s;
        }

        .mini-chip.selected {
            background: linear-gradient(135deg, var(--primary-light), #e0f7fa);
            border-color: var(--primary);
            color: var(--primary-dark);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 188, 212, 0.2);
        }

        /* Navigation Bar - Glassmorphism */
        .nav-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 450px;
            height: 72px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 188, 212, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            transition: all 0.3s;
            cursor: pointer;
            padding: 8px 16px;
        }

        .nav-item:hover {
            color: var(--primary);
        }

        .nav-item.active {
            color: var(--primary);
            transform: translateY(-3px);
        }

        .nav-item.active i {
            filter: drop-shadow(0 4px 8px rgba(0, 188, 212, 0.4));
        }

        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 600;
        }

        /* Buttons - Glassmorphism */
        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 188, 212, 0.35);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .primary-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .primary-btn:hover::before {
            left: 100%;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 188, 212, 0.45);
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        /* Toast - Glassmorphism */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            z-index: 200;
            box-shadow: 0 8px 24px rgba(0, 188, 212, 0.35);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Modal - Glassmorphism */
        #custom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 188, 212, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: var(--surface-solid);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px 24px;
            border-radius: 28px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: var(--shadow-glass);
            border: 1px solid var(--border);
        }

        /* Form Elements for Settings */
        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            background: #fff;
            color: var(--text-main);
            cursor: pointer;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            background: #fff;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .habit-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .habit-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #F9FAFB;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .habit-item:hover {
            background: #F3F4F6;
        }

        .habit-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .habit-item span {
            font-size: 14px;
            color: var(--text-main);
        }

        /* Two-column wallet grid */
        .wallet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .wallet-grid .visual-card {
            margin-bottom: 0;
        }

        /* Card organization selector */
        .card-org-selector {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .org-btn {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }

        .org-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
    </style>
</head>

<body>

    <div id="toast" class="toast"><i class="fas fa-check-circle" style="color: #4ade80;"></i> <span
            id="toast-msg">設定已儲存</span></div>

    <div class="app-container">

        <!-- View 1: Home -->
        <div id="view-home" class="view active">
            <div class="ui-card" style="border:none; box-shadow:none; background:transparent; padding: 10px 0;">
                <h1 id="user-name">載入中...</h1>
                <p class="subtitle">歡迎回來！管理您的智慧錢包</p>

                <div class="stat-grid">
                    <div class="stat-item">
                        <div class="stat-val" id="count-cards">0</div>
                        <div class="stat-lbl">持有卡片</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val" id="count-pay">0</div>
                        <div class="stat-lbl">支付綁定</div>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h3 style="font-size:16px;">我的卡片</h3>
                    <span style="font-size:12px; color:var(--primary); cursor:pointer;"
                        onclick="switchView('view-cards')">編輯</span>
                </div>

                <div id="wallet-preview">
                    <!-- Dynamic Cards Here -->
                    <div
                        style="text-align:center; padding:30px; border:2px dashed #E5E7EB; border-radius:16px; color:#9CA3AF;">
                        <i class="fas fa-wallet" style="font-size:24px; margin-bottom:8px;"></i>
                        <p style="font-size:13px;">錢包是空的</p>
                    </div>
                </div>
            </div>
            <div class="header">
                <div class="h-left">
                    <i class="fas fa-wallet" style="color:var(--primary); font-size:20px;"></i>
                    <span style="font-weight:700; font-size:18px;">CardWay <span
                            style="font-size:10px; color:#999; font-weight:400;" id="app-ver"></span></span>
                </div>
                <div class="h-right">
                    <i class="fas fa-bell header-icon"></i>
                </div>
            </div>
            <button class="primary-btn" onclick="switchView('view-cards')">
                <i class="fas fa-plus" style="margin-right:8px;"></i>新增卡片
            </button>
        </div>

        <!-- View 2: Add Cards -->
        <div id="view-cards" class="view">
            <div class="ui-card">
                <h1>選擇卡片</h1>
                <p class="subtitle">搜尋銀行並加入您的卡片</p>

                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="bank-search" class="search-input" placeholder="搜尋銀行（例如：國泰、中信）..."
                        oninput="filterBanks()">
                </div>

                <div class="bank-grid" id="bank-list">
                    <!-- Bank Pills -->
                </div>

                <h3 style="font-size:15px; margin-bottom:12px; color:var(--text-main);">卡片列表</h3>
                <div class="selection-list" id="card-list">
                    <!-- Cards -->
                </div>
            </div>

            <!-- Bottom Summary Bar -->
            <div style="position:fixed; bottom:100px; left:20px; right:20px; max-width:460px; margin:0 auto;">
                <button class="primary-btn" onclick="switchView('view-payments')"
                    style="display:flex; justify-content:space-between; padding: 16px 24px;">
                    <span>已選擇 <span id="cart-count">0</span> 張</span>
                    <span>下一步 <i class="fas fa-arrow-right"></i></span>
                </button>
            </div>
        </div>

        <!-- View 3: Payments -->
        <div id="view-payments" class="view">
            <div style="padding: 10px 0;">
                <h1>支付綁定</h1>
                <p class="subtitle">設定各個支付工具對應的卡片</p>

                <div id="payment-mapping-list">
                    <!-- Payment logic -->
                </div>
            </div>

            <div style="height: 100px;"></div> <!-- Spacer -->

            <div style="position:fixed; bottom:100px; left:20px; right:20px; max-width:460px; margin:0 auto;">
                <button class="primary-btn" id="save-btn" onclick="saveAll()">
                    <i class="fas fa-check" style="margin-right: 8px;"></i>儲存設定
                </button>
            </div>
        </div>

        <!-- View 4: Settings -->
        <div id="view-settings" class="view">
            <div style="padding: 10px 0;">
                <h1>進階設定</h1>
                <p class="subtitle">讓卡衛更了解你</p>

                <!-- 性別 -->
                <div class="ui-card">
                    <h3 style="font-size:15px; margin-bottom:12px;">您的性別</h3>
                    <div class="chip-container">
                        <div class="mini-chip" data-gender="male" onclick="selectGender(this)">男</div>
                        <div class="mini-chip" data-gender="female" onclick="selectGender(this)">女</div>
                        <div class="mini-chip" data-gender="neutral" onclick="selectGender(this)">中性</div>
                        <div class="mini-chip" data-gender="undisclosed" onclick="selectGender(this)">不透露</div>
                    </div>
                </div>

                <!-- 生日月份 -->
                <div class="ui-card">
                    <h3 style="font-size:15px; margin-bottom:12px;">生日月份</h3>
                    <select id="birth-month" class="form-select" onchange="updateProfile()">
                        <option value="">請選擇</option>
                        <option value="1">1 月</option>
                        <option value="2">2 月</option>
                        <option value="3">3 月</option>
                        <option value="4">4 月</option>
                        <option value="5">5 月</option>
                        <option value="6">6 月</option>
                        <option value="7">7 月</option>
                        <option value="8">8 月</option>
                        <option value="9">9 月</option>
                        <option value="10">10 月</option>
                        <option value="11">11 月</option>

        // Logic
        async function loadSettings() {
            if (IS_MOCK) {
                // 本地預覽模式：從 localStorage 讀取
                const saved = localStorage.getItem('cardway_data_v2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    myWallet = Array.isArray(parsed.myWallet) ? parsed.myWallet : [];
                    payMap = (typeof parsed.payMap === 'object') ? parsed.payMap : {};
                }
                updateCartCount();
                return;
            }

            try {
                const idToken = liff.getIDToken();
                const decoded = liff.getDecodedIDToken();
                const userId = decoded ? decoded.sub : null; // 直接取得 User ID

                // Fallback for Mock
                if (!userId && !IS_MOCK) throw new Error("無 User ID");

                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: "get_settings",
                        idToken: idToken,
                        userId: userId // 傳送 User ID
                    })
                });
                const data = await res.json();

                if (data.success === false) {
                    console.error("Server API Error", data.msg);
                    // Optional: showModal("同步失敗: " + data.msg);
                } else if (data.settings) {
                    myWallet = Array.isArray(data.settings.myWallet) ? data.settings.myWallet : [];
                    payMap = (typeof data.settings.payMap === 'object') ? data.settings.payMap : {};
                    myWallet = myWallet.filter(c => c && c.name);
                    // 載入 profile
                    if (data.settings.profile) {
                        Object.assign(userProfile, data.settings.profile);
                    }
                }
            } catch (e) {
                console.error("Sync Error", e);
                // showModal("讀取設定失敗: " + e.message, "⚠️");
            }
            updateCartCount();
        }

        async function saveAll() {
            const btn = document.getElementById('save-btn');
            const oldText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 同步中...';
            btn.disabled = true;

            if (IS_MOCK) {
                // 本地預覽模式：儲存到 localStorage
                localStorage.setItem('cardway_data_v2', JSON.stringify({ myWallet, payMap, profile: userProfile }));
                setTimeout(() => {
                    finishSave(btn, oldText);
                }, 500);
                return;
            }

            // Real Cloud Save
            try {
                const idToken = liff.getIDToken();
                const decoded = liff.getDecodedIDToken();
                const userId = decoded ? decoded.sub : null;

                if (!userId) throw new Error("無法取得 User ID (Save)");

                console.log("Saving to:", GAS_URL); // Debug URL

                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    // Google Apps Script 有時對 CORS 很嚴格，用 text/plain 通常最穩
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: "save_settings",
                        idToken,
                        userId,
                        myWallet,
                        payMap,
                        profile: userProfile
                    })
                });

                const text = await res.text();
                console.log("Server Response Raw:", text); // Debug Raw Response

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    // 如果回傳的是 HTML (通常是 404 或 Google 錯誤頁面)，這裡會報錯
                    throw new Error(`伺服器回應非 JSON (可能網址錯了或權限不足): ${text.substring(0, 100)}...`);
                }

                if (data.success || data.status === 'success') {
                    finishSave(btn, oldText);
                } else {
                    throw new Error(data.msg || "未知伺服器錯誤");
                }
            } catch (e) {
                console.error("Save Failed:", e);
                showModal(`儲存失敗！\n錯誤: ${e.message}\n(請截圖給工程師)`, "❌");
                btn.innerHTML = oldText;
                btn.disabled = false;
            }
        }

        // Render Banks as Pills
        function renderBanks(filter = "") {
            const container = document.getElementById('bank-list');
            container.innerHTML = '';
            const searchKey = filter.trim().toLowerCase();

            const banks = Object.keys(CARD_DB).filter(b => b.toLowerCase().includes(searchKey));

            if (banks.length === 0) {
                container.innerHTML = `<div style="width:100%; text-align:center; color:#9CA3AF; padding:10px;">找不到銀行</div>`;
                return;
            }

            banks.forEach(bank => {
                const pill = document.createElement('div');
                pill.className = `bank-pill ${bank === selectedBank ? 'active' : ''}`;
                pill.innerText = bank.split(" ")[1] || bank;
                pill.onclick = () => {
                    selectedBank = bank;
                    renderBanks(filter); // Re-render pills to update active state
                    renderCards(bank);
                };
                container.appendChild(pill);
            });
        }

        function filterBanks() {
            renderBanks(document.getElementById('bank-search').value);
        }

        // Render Cards List
        function renderCards(bank) {
            const container = document.getElementById('card-list');
            container.innerHTML = '';

            const cards = CARD_DB[bank] || [];
            if (cards.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#9CA3AF; padding:20px;">無卡片資料</div>`;
                return;
            }

            // 判斷是否為特殊卡組織（不顯示選擇器）
            const isSpecialOrg = bank.includes('美國運通') || bank.includes('樂天');

            cards.forEach(cardName => {
                const item = document.createElement('div');
                item.className = 'selection-item';
                item.style.flexDirection = 'column';
                item.style.alignItems = 'stretch';

                const existingCard = myWallet.find(c => c.name === cardName && c.bank === bank);
                const isSelected = !!existingCard;
                const currentOrg = existingCard?.org || 'visa';

                // Card info row
                const infoRow = document.createElement('div');
                infoRow.style.cssText = 'display:flex; justify-content:space-between; align-items:center; width:100%;';
                infoRow.innerHTML = `
                <div>
                    <div style="font-weight:600; font-size:15px; margin-bottom:2px;">${cardName}</div>
                    <div style="font-size:12px; color:var(--text-sub);">${bank}</div>
                </div>
              `;

                const btn = document.createElement('button');
                btn.className = `action-btn ${isSelected ? 'remove-icon' : 'add-icon'}`;
                btn.innerHTML = isSelected ? '<i class="fas fa-minus"></i>' : '<i class="fas fa-plus"></i>';
                btn.onclick = () => toggleCard(bank, cardName, 'visa');

                infoRow.appendChild(btn);
                item.appendChild(infoRow);

                // Card organization selector (only for non-special cards)
                if (isSelected && !isSpecialOrg) {
                    const orgSelector = document.createElement('div');
                    orgSelector.className = 'card-org-selector';

                    ['visa', 'mastercard', 'jcb'].forEach(org => {
                        const orgBtn = document.createElement('button');
                        orgBtn.className = `org-btn ${currentOrg === org ? 'active' : ''}`;
                        orgBtn.innerText = org.toUpperCase();
                        orgBtn.onclick = (e) => {
                            e.stopPropagation();
                            updateCardOrg(bank, cardName, org);
                        };
                        orgSelector.appendChild(orgBtn);
                    });

                    item.appendChild(orgSelector);
                }

                container.appendChild(item);
            });
        }

        function updateCardOrg(bank, cardName, org) {
            const card = myWallet.find(c => c.name === cardName && c.bank === bank);
            if (card) {
                card.org = org;
                renderCards(bank);
                showToast(`已設定為 ${org.toUpperCase()}`);

        function toggleCard(bank, name, org = 'visa') {
            const idx = myWallet.findIndex(c => c.name === name);
            if (idx > -1) {
                myWallet.splice(idx, 1);
                // Clean payMap
                Object.keys(payMap).forEach(key => {
                    payMap[key] = payMap[key].filter(n => n !== name);
                });
                // Clean mainCards
                userProfile.mainCards = userProfile.mainCards.filter(n => n !== name);
            } else {
                myWallet.push({ bank, name, org });
            }

            updateCartCount();
            renderCards(bank); // Update UI
            showToast(idx > -1 ? "已移除卡片" : "已加入卡片");
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = myWallet.length;
        }

        // Render Payments
        function renderPaymentSetup() {
            const container = document.getElementById('payment-mapping-list');
            container.innerHTML = '';

            if (myWallet.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#9CA3AF;">請先至「找卡」頁面加入卡片</div>`;
                return;
            }

            PAY_METHODS.forEach(method => {
                const div = document.createElement('div');
                div.className = 'pay-section';

                const selectedCards = payMap[method.name] || [];

                div.innerHTML = `
                <div class="pay-header">
                    <div class="pay-icon"><i class="${method.icon}"></i></div>
                    <span>${method.name}</span>
                </div>
              `;

                const chipCont = document.createElement('div');
                chipCont.className = 'chip-container';

                myWallet.forEach(card => {
                    const chip = document.createElement('div');
                    const isSelected = selectedCards.includes(card.name);
                    chip.className = `mini-chip ${isSelected ? 'selected' : ''}`;
                    chip.innerText = card.name;
                    chip.onclick = () => {
                        if (!payMap[method.name]) payMap[method.name] = [];

                        if (isSelected) {
                            payMap[method.name] = payMap[method.name].filter(n => n !== card.name);
                        } else {
                            payMap[method.name].push(card.name);
                        }
                        renderPaymentSetup(); // Re-render to show state
                    };
                    chipCont.appendChild(chip);
                });

                div.appendChild(chipCont);
                container.appendChild(div);
            });
        }

        // Home & Visuals
        function updateHomeStats() {
            // Numbers
            document.getElementById('count-cards').innerText = myWallet.length;
            const linkedCount = Object.values(payMap).reduce((acc, curr) => acc + curr.length, 0);
            document.getElementById('count-pay').innerText = linkedCount;

            // Visual Cards
            const preview = document.getElementById('wallet-preview');
            preview.innerHTML = '';

            if (myWallet.length === 0) {
                preview.innerHTML = `
                <div style="text-align:center; padding:30px; border:2px dashed #E5E7EB; border-radius:16px; color:#9CA3AF;">
                    <i class="fas fa-wallet" style="font-size:24px; margin-bottom:8px;"></i>
                    <p style="font-size:13px;">錢包是空的</p>
                </div>`;
                return;
            }

            // Create two-column grid container
            const gridContainer = document.createElement('div');
            gridContainer.className = 'wallet-grid';

            myWallet.forEach(card => {
                const div = document.createElement('div');
                div.className = 'visual-card';
                div.setAttribute('data-bank', card.bank);

                const cardOrg = card.org || 'visa';
                const orgIcon = cardOrg === 'mastercard' ? 'fa-cc-mastercard' :
                    cardOrg === 'jcb' ? 'fa-cc-jcb' : 'fa-cc-visa';

                div.innerHTML = `
                <div class="vc-top">
                    <div class="vc-chip"></div>
                    <i class="fab ${orgIcon}" style="font-size:24px; opacity:0.8;"></i>
                </div>
                <div class="vc-name">${card.name}</div>
                <div class="vc-bank">${card.bank.split(" ")[1] || card.bank}</div>
              `;
                gridContainer.appendChild(div);
            });

            preview.appendChild(gridContainer);
        }

        function finishSave(btn, oldText) {
            btn.innerHTML = oldText;
            btn.disabled = false;
            showToast("✅ 設定已同步至雲端");
        }

        // Utils
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        function showModal(msg, icon = "👋") {
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('custom-modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('custom-modal').style.display = 'none';
        }

        // Settings Page Functions
        let userProfile = {
            gender: '',
            birthMonth: '',
            cardHabits: [],
            mainCards: [],
            wantedFeatures: '',
            supportPrice: 0,
            painPoints: ''
        };

        function selectGender(el) {
            document.querySelectorAll('[data-gender]').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            userProfile.gender = el.dataset.gender;
        }

        function selectPrice(el) {
            document.querySelectorAll('[data-price]').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            userProfile.supportPrice = parseInt(el.dataset.price);
        }

        function toggleOtherHabit(checkbox) {
            const textInput = document.getElementById('other-habit-text');
            textInput.style.display = checkbox.querySelector('input').checked ? 'block' : 'none';
            updateProfile();
        }

        function toggleMainCard(cardName) {
            const idx = userProfile.mainCards.indexOf(cardName);
            if (idx > -1) {
                userProfile.mainCards.splice(idx, 1);
            } else if (userProfile.mainCards.length < 3) {
                userProfile.mainCards.push(cardName);
            } else {
                showToast('最多選擇 3 張主力卡片');
                return;
            }
            renderMainCards();
        }

        function renderMainCards() {
            const container = document.getElementById('main-card-list');
            if (!container) return;
            container.innerHTML = '';

            if (myWallet.length === 0) {
                container.innerHTML = '<div style="color:#9CA3AF; font-size:13px;">請先加入卡片</div>';
                return;
            }

            myWallet.forEach(card => {
                const chip = document.createElement('div');
                const isSelected = userProfile.mainCards.includes(card.name);
                chip.className = `mini-chip ${isSelected ? 'selected' : ''}`;
                chip.innerText = card.name;
                chip.onclick = () => toggleMainCard(card.name);
                container.appendChild(chip);
            });
        }

        function updateProfile() {
            // Get birth month
            userProfile.birthMonth = document.getElementById('birth-month')?.value || '';

            // Get habits
            userProfile.cardHabits = [];
            document.querySelectorAll('input[name="habit"]:checked').forEach(cb => {
                userProfile.cardHabits.push(cb.value);
            });
            const otherText = document.getElementById('other-habit-text')?.value;
            if (otherText) userProfile.cardHabits.push(otherText);

            // Get textarea values
            userProfile.wantedFeatures = document.getElementById('wanted-features')?.value || '';
            userProfile.painPoints = document.getElementById('pain-points')?.value || '';
        }

        function renderSettingsView() {
            renderMainCards();

            // Restore saved profile values
            if (userProfile.gender) {
                document.querySelectorAll('[data-gender]').forEach(e => {
                    if (e.dataset.gender === userProfile.gender) e.classList.add('selected');
                });
            }
            if (userProfile.birthMonth) {
                document.getElementById('birth-month').value = userProfile.birthMonth;
            }
            if (userProfile.supportPrice) {
                document.querySelectorAll('[data-price]').forEach(e => {
                    if (parseInt(e.dataset.price) === userProfile.supportPrice) e.classList.add('selected');
                });
            }
        }
    </script>
</body>

</html>
